server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /

spring:
  application:
    name: calisthenics-ai-backend
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calisthenics_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${STORAGE_MAX_FILE_SIZE:100MB}
      max-request-size: ${STORAGE_MAX_FILE_SIZE:100MB}

# Custom Application Properties
app:
  admin:
    bootstrap-secret: ${ADMIN_BOOTSTRAP_SECRET:}
  mail:
    from: ${MAIL_USERNAME:}
  password-reset:
    otp-hmac-secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:60}
  
  storage:
    location: ${STORAGE_LOCATION:./uploads}

  firebase:
    enabled: ${FIREBASE_ENABLED:true}
    project-id: ${FIREBASE_PROJECT_ID:sky-bf5aa}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}
    credentials-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
    check-revoked: ${FIREBASE_CHECK_REVOKED:true}
    require-credentials: ${FIREBASE_REQUIRE_CREDENTIALS:false}

  google:
    client-id: ${GOOGLE_CLIENT_ID:610669602436-6vga6qoca1iefspli4o28ets4fgkv68j.apps.googleusercontent.com}

  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-lite-latest}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    initial-retry-delay-ms: ${GEMINI_INITIAL_RETRY_DELAY_MS:1000}
    max-retry-delay-ms: ${GEMINI_MAX_RETRY_DELAY_MS:8000}
    max-retry-after-ms: ${GEMINI_MAX_RETRY_AFTER_MS:15000}

  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}

  workout-planner:
    min-exercises-per-session: ${WORKOUT_PLANNER_MIN_EXERCISES:1}
    recommended-min-exercises: ${WORKOUT_PLANNER_RECOMMENDED_MIN_EXERCISES:4}
    recommended-max-exercises: ${WORKOUT_PLANNER_RECOMMENDED_MAX_EXERCISES:8}
    max-exercises-per-session: ${WORKOUT_PLANNER_MAX_EXERCISES:10}
    beginner-max-exercises: ${WORKOUT_PLANNER_BEGINNER_MAX_EXERCISES:8}
    intermediate-max-exercises: ${WORKOUT_PLANNER_INTERMEDIATE_MAX_EXERCISES:10}
    advanced-max-exercises: ${WORKOUT_PLANNER_ADVANCED_MAX_EXERCISES:10}
    skill-mobility-max-exercises: ${WORKOUT_PLANNER_SKILL_MOBILITY_MAX_EXERCISES:8}
    min-training-days-per-week: ${WORKOUT_PLANNER_MIN_TRAINING_DAYS:1}
    max-training-days-per-week: ${WORKOUT_PLANNER_MAX_TRAINING_DAYS:7}
    min-duration-weeks: ${WORKOUT_PLANNER_MIN_DURATION_WEEKS:1}
    max-duration-weeks: ${WORKOUT_PLANNER_MAX_DURATION_WEEKS:12}
    correction-retries: ${WORKOUT_PLANNER_CORRECTION_RETRIES:1}

# Springdoc OpenAPI Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# Actuator Health Check
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
